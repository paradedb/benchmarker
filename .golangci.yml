# Preserve the previous default exclusions when migrating from golangci-lint v1.
version: "2"
linters:
  settings:
    staticcheck:
      # Preserve v1 correctness and simplification checks without new quick fixes.
      checks:
        - all
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
