driver: postgres
container: vectorchord
connection: postgres://postgres:postgres@localhost:5435/benchmark
envVar: VECTORCHORD_URL
description: VectorChord vector indexes
color: "#FF3621"
extras:
  gucPrefixes: [vchord, vchordrq, vchordg]
  indexAccessMethods: [vchordrq, vchordg]
  queries:
    - key: vectorchord
      query: |
        SELECT 'vectorchord.' || extname || '_version', extversion
        FROM pg_extension
        WHERE extname IN ('vchord', 'vector')
        ORDER BY extname
