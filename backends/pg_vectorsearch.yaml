driver: postgres
container: pg_vectorsearch
connection: postgres://postgres:postgres@localhost:5434/benchmark
envVar: PG_VECTORSEARCH_URL
description: Timescale pg_vectorsearch PRISM vector index
color: "#F1FF5C"
extras:
  indexAccessMethods: [prism]
  queries:
    # Load the extension library in this session before reading its GUCs.
    - key: pg_vectorsearch.version
      query: SELECT pg_vectorsearch_version()
    - key: prism
      query: |
        SELECT name, setting || COALESCE(unit, '')
        FROM pg_settings
        WHERE name LIKE 'prism.%'
        ORDER BY name
