backend: postgres
container: paradedb
connection: postgres://postgres:postgres@localhost:5432/benchmark
envVar: PARADEDB_URL
description: ParadeDB pg_search BM25 index
color: "#7C3AED"
extras:
  gucPrefixes: [paradedb]
  indexAccessMethods: [paradedb, bm25]
  queries:
    - key: paradedb.version
      query: SELECT paradedb.version_info()::text
    - key: segments_at_run_start
      query: |
        SELECT 'paradedb.segments_at_run_start.' || c.relname,
               (SELECT count(*) FROM paradedb.index_info(c.oid::regclass))::text
        FROM pg_class c
        JOIN pg_am am ON c.relam = am.oid
        WHERE am.amname = 'paradedb'
        ORDER BY c.relname
