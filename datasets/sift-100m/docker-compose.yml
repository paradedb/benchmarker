services:
  paradedb:
    image: ${PARADEDB_IMAGE:-paradedb/paradedb:v0.26.0-rc.4-pg18}
    container_name: paradedb
    shm_size: 6g
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
    ports:
      - "5432:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 6
          memory: 12g
        reservations:
          cpus: 6
    cpus: 6
    mem_limit: 12g
    # Parallelism follows the 6 CPUs: the pool gets every CPU, and a single
    # query or index build gets 5 workers plus its leader.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_search,pg_cron"
      - "-c"
      - "shared_buffers=8GB"
      - "-c"
      - "effective_cache_size=10GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=256MB"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_parallel_workers_per_gather=5"
      - "-c"
      - "max_parallel_maintenance_workers=5"
      - "-c"
      - "max_parallel_workers=6"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "jit=off"

  # Opt-in (`--profile elasticsearch`): both engines at the default 12g don't
  # fit a 16GiB Docker VM together.
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.5.3}
    container_name: elasticsearch
    profiles: ["elasticsearch"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Heap at a third of the container limit: the HNSW graph and raw vectors
      # are read off-heap through the page cache, bounded by the same limit.
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: 6
          memory: 12g
    cpus: 6
    mem_limit: 12g

volumes:
  paradedb_data:
  elasticsearch_data:
