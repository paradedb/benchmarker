services:
  paradedb:
    image: paradedb/paradedb:v0.26.0-rc.4-pg18
    container_name: paradedb
    shm_size: 6g
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
    ports:
      - "5432:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 12G
        reservations:
          cpus: "2"
          memory: 8G
    cpus: 6
    mem_limit: 12g
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_search,pg_cron"
      - "-c"
      - "shared_buffers=8GB"
      - "-c"
      - "effective_cache_size=10GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=256MB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=2"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "jit=off"

volumes:
  paradedb_data:
